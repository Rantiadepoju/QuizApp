
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp - Play & Earn-RantiDev</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="web icon.jpg" type="image/X-icon">
</head>
<body>

    <main class="quiz-container">
        <img class="brand-icon" src="web icon.jpg" alt="QuizApp icon">
        <button id="musicToggle" type="button" aria-pressed="true">
            🎵 Music: On
        </button>
        <audio id="background-music" preload="auto" loop>
            <source src="sondangsirait419-1-efek-sound-2-220036.mp3" type="audio/mpeg">
        </audio>
        <!-- Start Screen -->
        <section id="start-screen" class="screen">
            <img class="home-logo" src="I.Q.jpg" alt="QuizApp logo">
            <h1>QuizApp</h1>
            <p>Challenge your mind and earn rewards!</p>
            <p>Answer correctly to collect virtual coins.</p>

            <label for="player-name">Enter your name to play</label>
            <input id="player-name" name="playerName" type="text"
                autocomplete="name" maxlength="40" required>

            <div class="reward-preview">
                🪙 Earn 10 coins for every correct answer
            </div>
            <button id="start-btn">Start Quiz</button>
            <p class="developer-credit">This QuizApp is developed by RantiDev.</p>
        </section>

        <!-- Quiz Screen -->
        <section id="quiz-screen" class="screen hidden">

            <div class="game-toolbar">
                <div id="coin-balance">🪙 Coins: 0</div>
                <button id="music-btn" class="music-button"
                    type="button" aria-pressed="true">
                    🎵 Music: On
                </button>
            </div>

            <p id="progress">Question 1 of 50</p>
            <h2 id="question"></h2>

            <div id="choices" class="choices"></div>

            <p id="feedback" aria-live="polite"></p>

            <div class="navigation-buttons">
                <button id="back-btn" type="button" disabled>
                    ← Go Back
                </button>

                <button id="next-btn" type="button" disabled>
                    Check Answer
                </button>

                <button id="quiz-restart-btn" type="button">
                    Restart
                </button>
            </div>
        </section>

        <!-- Results Screen -->
        <section id="results-screen" class="screen hidden">
            <div class="game-icon">🏆</div>
            <h1>Quiz Completed!</h1>

            <h2 id="final-score"></h2>
            <p id="result-message"></p>

            <div class="final-reward">
                <p>Total Coins Earned</p>
                <h2 id="final-coins">🪙 0</h2>
            </div>

            <button id="restart-btn" type="button">
                Play Again
            </button>
        </section>

    </main>
    <script src="app.js" defer></script>
</body>
</html>
